name: "Build and publish"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3). Leave empty to bump the patch of the latest release.'
        required: false
        default: ''

env:
  MAIN_PROJECT_PATH: 'FluentFin\FluentFin.csproj'
  FFMPEG_PATH: 'Installer\FFmpeg'
  PUBLISH_FOLDER: 'FluentFin\bin\publish'
  PUBLISH_FOLDER_ARM64: 'FluentFin\bin\publish-arm64'
  FFMPEG_ARM64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl-shared.zip
  CTK_LABS_INDEX: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json

jobs:
    deploy:
        name: 'Build and deploy'
        runs-on: 'windows-latest'
        steps:
        -   name: 'Checkout'
            uses: actions/checkout@v2

        -   name: 'Install dotnet'
            uses: actions/setup-dotnet@v1
            with:
                dotnet-version: '10.0'

        -   name: 'Add msbuild to PATH'
            uses: microsoft/setup-msbuild@v1.1

        -   name: Add Windows Community Toolkit labs nuget source
            run: dotnet nuget add source ${{env.CTK_LABS_INDEX}} -n CommunityToolkitLabs

        # Release tags have no 'v' prefix: UpdateService parses tag_name with new Version(...)
        -   name: 'Get version'
            id: version
            shell: pwsh
            env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                INPUT_VERSION: ${{ inputs.version }}
            run: |
                $v = $env:INPUT_VERSION.Trim().TrimStart('v')
                if (-not $v) {
                    $last = [version](gh release view --json tagName -q .tagName).TrimStart('v')
                    $v = "$($last.Major).$($last.Minor).$($last.Build + 1)"
                }
                if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$v'" }
                gh release view $v 2>$null
                if ($LASTEXITCODE -eq 0) { throw "Release $v already exists" }
                $global:LASTEXITCODE = 0
                "version-without-v=$v" >> $env:GITHUB_OUTPUT

        -   name: 'Build Project'
            run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ env.PUBLISH_FOLDER }}\ /property:BuildVersion=${{ steps.version.outputs.version-without-v }}

        # native FFmpeg for Flyleaf; the DLL names must match the x64 ones in FluentFin\FFMpeg
        # TODO: this is BtbN's stock arm64 build. The x64 DLLs are a custom decoder-only build
        #       (--disable-encoders, plus libaom/libdavs2/libuavs3d/libopenmpt/lcevc-dec). Build a
        #       matching arm64 FFmpeg to drop the unused encoders and get those extra decoders.
        -   name: 'Download arm64 FFmpeg'
            shell: pwsh
            run: |
                Invoke-WebRequest $env:FFMPEG_ARM64_URL -OutFile ffmpeg-arm64.zip
                Expand-Archive ffmpeg-arm64.zip -DestinationPath ffmpeg-arm64
                New-Item -ItemType Directory -Force FluentFin\FFMpeg-arm64 | Out-Null
                foreach ($x64 in Get-ChildItem FluentFin\FFMpeg\*.dll) {
                    $match = Get-ChildItem ffmpeg-arm64 -Recurse -Filter $x64.Name | Select-Object -First 1
                    if (-not $match) { throw "arm64 FFmpeg is missing $($x64.Name)" }
                    Copy-Item $match.FullName FluentFin\FFMpeg-arm64\
                }

        -   name: 'Build Project (arm64)'
            run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-arm64 -p:Platform=arm64 -o ${{ env.PUBLISH_FOLDER_ARM64 }}\ /property:BuildVersion=${{ steps.version.outputs.version-without-v }}

        -   name: Create Windows Installer
            uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
            with:
                path: Installer\script.iss
                options: /O+

        -   name: Create Windows Installer (arm64)
            uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
            with:
                path: Installer\script.iss
                options: /O+ /DArch=arm64

        -   name: 'Create Release'
            shell: pwsh
            env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: gh release create ${{ steps.version.outputs.version-without-v }} Installer\Output\FluentFin.exe Installer\Output\FluentFin_arm64.exe --target ${{ github.sha }} --title ${{ steps.version.outputs.version-without-v }}
