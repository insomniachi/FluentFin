name: "Tests"

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  tests:
    name: 'Unit and style tests'
    runs-on: ubuntu-latest
    steps:
    -   name: 'Checkout'
        uses: actions/checkout@v4

    -   name: 'Install dotnet'
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '10.0'

    # FluentFin.Core.Tests only needs the cross-platform Core project; it also reads the XAML files
    # (OverlayContrastTests), so the WinUI app itself is not built here.
    -   name: 'Test'
        run: dotnet test FluentFin.Core.Tests/FluentFin.Core.Tests.csproj
